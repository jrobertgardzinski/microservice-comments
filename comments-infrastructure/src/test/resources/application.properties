# tests: the same Flyway schema on in-memory H2 (PostgreSQL mode); no broker, no other services
spring.datasource.url=jdbc:h2:mem:comments;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
comments.kafka-enabled=false
# outbound dependencies are stubbed in tests, the URLs are placeholders for bean wiring
security.url=http://localhost:8080
memes.url=http://localhost:8083

# The cucumber suite shares ONE Spring context and therefore one RateLimit bean, and it runs in
# about two seconds — inside a single minute window. Counted from the feature, alice makes 18 POSTs
# that reach tryAcquire against a production default of 20 per author: two tokens of margin. One
# more scenario, or one more "she comments" step, and scenarios would start failing on a limiter
# nobody was testing, in a suite that is about comment threads. Zero disables the guard (pinned by
# RateLimitTest), and the 429 contract gets a test of its own — see CommentRateLimitHttpTest.
comments.rate-limit.per-minute=0

# The management block, copied ONCE from src/main/resources/application.properties.
#
# A file of this name on the test classpath does not merge with the shipped one, it REPLACES it —
# so every test context ran with Spring's defaults for these, and each test that cared passed them
# back in through @SpringBootTest(properties = …). That is how ProbeUrlsTest came to hand itself the
# very exposure line it claimed to verify: remove `health` from the file that goes into the image and
# the whole suite stayed green while /actuator/health/readiness answered 404 in the cluster and the
# pod never went Ready.
#
# The copy is what lets the tests exercise these settings; it is NOT what pins them. Half 1 of
# ProbeUrlsTest and of ListenerHealthProbeGroupsTest reads the SHIPPED file directly and asserts on
# it, so a drift between these lines and the ones that are deployed fails there, by name.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,kafkaListeners
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=always
