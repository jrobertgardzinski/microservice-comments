spring.application.name=comments-service
server.port=8085

# Real persistence: Postgres in the stack, Flyway owns the schema (H2 stands in for tests).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/comments}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secret}

# Who confirms tokens and who knows which memes exist.
security.url=${SECURITY_URL:http://localhost:8080}
memes.url=${MEMES_URL:http://localhost:8083}

# The gallery UI's origin (it is served by microservice-memes and calls this service directly).
comments.ui-origin=${UI_ORIGIN:http://localhost:8083}

# Account-deletion saga (comments axis) + the MEME_DELETED thread cascade; enabled where a broker
# exists. Rule vocabulary: DELETE | ANONYMIZE_AUTHOR | KEEP_POPULAR_ANONYMIZED:<minScore>.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
comments.kafka-enabled=${KAFKA_ENABLED:false}

# earliest, EXPLICIT — Kafka's own default is latest, and latest loses records without a trace: a
# consumer group that has no committed offset yet (a fresh environment, or Kafka switched on after
# this service ran without it) starts AFTER whatever the topic already holds, so purge commands and
# MEME_DELETED hops published before the group's first poll are simply never seen — no log line, no
# metric, a saga that times out and threads that outlive their memes for no visible reason. earliest
# walks the retained history instead, which costs nothing to repeat: both listeners are idempotent
# (see PurgeCommandsListener and MemesEventsListener), exactly the reasoning
# microservice-user-collections wrote down for the same setting. Pinned by
# KafkaConsumerOffsetResetTest.
spring.kafka.consumer.auto-offset-reset=earliest

# The producer's delivery clocks, EXPLICIT — new in round 10, and overdue: this service had none,
# which was written down as a risk when the fire-and-forget announcement shipped. KafkaTemplate.send
# is asynchronous only AFTER the record reaches the accumulator; getting there blocks the CALLING
# thread on the metadata fetch (no partition leader = no metadata) and on a full buffer for up to
# max.block.ms, whose Kafka default is 60s. The announcing thread here is the Kafka LISTENER thread
# of the 'comments' consumer group (MemesEventsListener drives the cascade hop), so with the default
# a leaderless comments-events would hold that thread a minute per deletion — straight at the 300s
# max.poll.interval.ms that turns a broker outage into a consumer-group rebalance, i.e. into this
# service no longer dropping threads at all.
#
# 5000 = the same patience RepublisherSettings.defaults gives the republisher's ack (see
# CommentsOutboxConfig): ONE "how long do we wait for a broker" number for the service. A stalled
# send now costs 5s and nothing durable — the outbox row survives it and the republisher carries the
# guarantee. Delivery/request are the numbers microservice-memes, microservice-offboarding's
# KafkaLoop and microservice-user-collections' PurgeCommandsConsumer already run on, so the whole
# cascade fails over on one set of clocks. Pinned by KafkaProducerClocksTest.
spring.kafka.producer.properties.max.block.ms=${COMMENTS_KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${COMMENTS_KAFKA_DELIVERY_TIMEOUT_MS:30000}
spring.kafka.producer.properties.request.timeout.ms=${COMMENTS_KAFKA_REQUEST_TIMEOUT_MS:15000}

# Outbox retention: rows marked published survive this many hours, then the republisher's pass
# deletes them — a delivered event has no value once its consumers absorbed it. Refused at boot if
# not at least 1 (a retention of 0 would reap rows as fast as they are marked).
comments.outbox.retention-hours=${COMMENTS_OUTBOX_RETENTION_HOURS:24}

# How often the outbox republisher passes: re-send what the broker never confirmed, reap what it
# demonstrably delivered. Spelled out here, without the comments prefix, because the name belongs to
# the shared library (ScheduledOutboxRepublisher.INTERVAL_PROPERTY) — a library owns no
# configuration namespace. It has a built-in 15s default; this line exists so an operator can FIND
# the dial in this file instead of in a jar, and so the env override has a name.
outbox.republish-interval-ms=${COMMENTS_OUTBOX_REPUBLISH_INTERVAL_MS:15000}

# Anti-spam: at most this many comments per author per minute (429 above it; 0 disables).
comments.rate-limit.per-minute=${COMMENT_RATE_LIMIT:20}
comments.purge.comments=${PURGE_COMMENTS_POLICY:ANONYMIZE_AUTHOR}

# The saga participant's listener loops (the saga's commands and the cascade's MEME_DELETED): their
# heartbeat and the tolerance the health lamp measures it against (SagaListenersHealth). Idle events
# ARE the heartbeat: a container publishes one per interval whenever a poll comes back empty, which is
# what lets the lamp tell "polling, nothing to do" — content-commands is silent for days between
# account deletions — from "the loop has stopped". 10s is a fifteenth of the tolerance below, so a
# stall is noticed within the tolerance plus one interval.
spring.kafka.listener.idle-event-interval=10s

# How long a listener container may go without completing a poll before READINESS reports it. The
# floor (and the default) is 150s and it is derived, not chosen: the retries of one saga command sleep
# ON the consumer thread, and the last attempt of a record can start a whole 90s retry budget
# (SagaRetryBudget) after a first failure that itself followed a 30s Hikari connection timeout, then
# block 30s of its own — 30+90+30. A smaller value would paint every purge riding out a database
# restart as a dead listener; SagaParticipantConfig refuses one, naming this variable.
comments.saga.listener-stall-seconds=${COMMENTS_LISTENER_STALL_SEC:150}

# observability: correlation id on every log line
# the stack's shared log line (observability/README.md): ISO time, level, cid, trace
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [cid=%X{cid:-}] [trace=%X{trace_id:-}] %logger{24} - %msg%n

# observability: metrics for the workspace's Prometheus (scrape: /actuator/prometheus)
#
# The actuator gets a port of its own, as it does in memes — and here the reason is who can REACH
# it, not only who can starve it. This service is published on the comments.portal.localhost
# ingress host with a single `/` rule, so everything the application port answers is answerable
# from a browser: /actuator/prometheus has been, and the listener lamp's details (container ids,
# poll ages) joined it when show-details went to `always`. None of it is private — the lamp is
# PII-free by construction and these metrics carry no secrets — but "reachable by anyone who can
# resolve the host" is not a property to acquire by accident, and no Service or ingress rule routes
# 9085. memes' reason applies here as well: a probe sharing the request port times out for the
# same reason the service is busy, and kubelet then kills a pod that is merely under load.
management.server.port=9085
management.endpoints.web.exposure.include=health,prometheus

# The probe GROUPS, declared here rather than left to Spring's Kubernetes auto-detection, because this
# service now has an opinion about which group a Kafka listener belongs to — and because groups that
# only exist inside k8s cannot be probed on the compose stack where this actually runs.
#
# readiness carries the listener lamp: a participant whose loop has stopped cannot do its share of an
# account deletion, and readiness is the signal that means "do not send me work". liveness deliberately
# does NOT: a stopped listener is not a dead process, and a restart would fix neither the broker nor
# the database that stopped it — the same split microservice-offboarding and microservice-user-collections
# arrived at when they separated /alive from /health. The bare /actuator/health (what the compose
# healthcheck probes) aggregates everything, the listener lamp included.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,kafkaListeners
management.endpoint.health.group.liveness.include=livenessState

# And the details the lamp goes to the trouble of building — container ids, states, ages, and the
# distinction between "the thread died" and "the poll stalled". Boot's default for show-details is
# "never", so until this line every /actuator/health answer in compose and in the cluster was a bare
# {"status":"DOWN"}: the diagnosis SagaListenersHealth documents at length existed in no environment
# where the lamp actually runs, and the only place it could be seen was a test that set this property
# itself. The details are deliberately PII-free — a purge command carries the leaver's address and
# none of it goes in here (see SagaListenersHealth#health).
#
# WHO CAN READ THEM, said out loud rather than assumed: nobody from the ingress. The actuator sits
# on the management connector configured 26 lines above (9085), and no Service or ingress rule
# routes it — /actuator/health on the published port answers 404, which the CI boot gate asserts.
#
# This paragraph used to say the opposite ("this service has no such split, so everything on 8085
# answers on the comments.portal.localhost ingress host... the older question belongs to the next
# round"), and it was true for the sixty-seven minutes between the commit that wrote it and the one
# that added management.server.port — which did not come back to correct it. Left standing, it sends
# a reader either to revoke show-details for an exposure that no longer exists, or to
# comments.portal.localhost/actuator/health for a diagnosis that answers 404. Same defect as P15
# poz. 23, in the file an operator reads to learn what this property costs.
management.endpoint.health.show-details=always
