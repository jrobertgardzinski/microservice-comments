spring.application.name=comments-service
server.port=8085

# Real persistence: Postgres in the stack, Flyway owns the schema (H2 stands in for tests).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/comments}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secret}

# Who confirms tokens and who knows which memes exist.
security.url=${SECURITY_URL:http://localhost:8080}
memes.url=${MEMES_URL:http://localhost:8083}

# The gallery UI's origin (it is served by microservice-memes and calls this service directly).
comments.ui-origin=${UI_ORIGIN:http://localhost:8083}

# Account-deletion saga (comments axis) + the MEME_DELETED thread cascade; enabled where a broker
# exists. Rule vocabulary: DELETE | ANONYMIZE_AUTHOR | KEEP_POPULAR_ANONYMIZED:<minScore>.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
comments.kafka-enabled=${KAFKA_ENABLED:false}

# The producer's delivery clocks, EXPLICIT — new in round 10, and overdue: this service had none,
# which was written down as a risk when the fire-and-forget announcement shipped. KafkaTemplate.send
# is asynchronous only AFTER the record reaches the accumulator; getting there blocks the CALLING
# thread on the metadata fetch (no partition leader = no metadata) and on a full buffer for up to
# max.block.ms, whose Kafka default is 60s. The announcing thread here is the Kafka LISTENER thread
# of the 'comments' consumer group (MemesEventsListener drives the cascade hop), so with the default
# a leaderless comments-events would hold that thread a minute per deletion — straight at the 300s
# max.poll.interval.ms that turns a broker outage into a consumer-group rebalance, i.e. into this
# service no longer dropping threads at all.
#
# 5000 = the same patience RepublisherSettings.defaults gives the republisher's ack (see
# CommentsOutboxConfig): ONE "how long do we wait for a broker" number for the service. A stalled
# send now costs 5s and nothing durable — the outbox row survives it and the republisher carries the
# guarantee. Delivery/request are the numbers microservice-memes, microservice-offboarding's
# KafkaLoop and microservice-user-collections' PurgeCommandsConsumer already run on, so the whole
# cascade fails over on one set of clocks. Pinned by KafkaProducerClocksTest.
spring.kafka.producer.properties.max.block.ms=${COMMENTS_KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${COMMENTS_KAFKA_DELIVERY_TIMEOUT_MS:30000}
spring.kafka.producer.properties.request.timeout.ms=${COMMENTS_KAFKA_REQUEST_TIMEOUT_MS:15000}

# Outbox retention: rows marked published survive this many hours, then the republisher's pass
# deletes them — a delivered event has no value once its consumers absorbed it. Refused at boot if
# not at least 1 (a retention of 0 would reap rows as fast as they are marked).
comments.outbox.retention-hours=${COMMENTS_OUTBOX_RETENTION_HOURS:24}

# How often the outbox republisher passes: re-send what the broker never confirmed, reap what it
# demonstrably delivered. Spelled out here, without the comments prefix, because the name belongs to
# the shared library (ScheduledOutboxRepublisher.INTERVAL_PROPERTY) — a library owns no
# configuration namespace. It has a built-in 15s default; this line exists so an operator can FIND
# the dial in this file instead of in a jar, and so the env override has a name.
outbox.republish-interval-ms=${COMMENTS_OUTBOX_REPUBLISH_INTERVAL_MS:15000}

# Anti-spam: at most this many comments per author per minute (429 above it; 0 disables).
comments.rate-limit.per-minute=${COMMENT_RATE_LIMIT:20}
comments.purge.comments=${PURGE_COMMENTS_POLICY:ANONYMIZE_AUTHOR}

# observability: correlation id on every log line
# the stack's shared log line (observability/README.md): ISO time, level, cid, trace
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [cid=%X{cid:-}] [trace=%X{trace_id:-}] %logger{24} - %msg%n

# observability: metrics for the workspace's Prometheus (scrape: /actuator/prometheus)
management.endpoints.web.exposure.include=health,prometheus
