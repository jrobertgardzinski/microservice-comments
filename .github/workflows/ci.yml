name: CI

# microservice-comments needs one sibling SNAPSHOT (voting, public), so CI checks it out and
# installs it first. Checkouts use the workspace layout (each repo in its own directory) because
# both provider tests verify a neighbour's committed pact from its sibling checkout — offboarding's
# saga confirmation and user-collections' COMMENTS_DELETED cascade. A consumer that is not cloned
# does not fail the verification, it SKIPS it, so every consumer whose pact this repo is meant to
# honour has to be listed below. The reactor CI (in the aggregator repo) still validates everything
# together.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: microservice-comments
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/voting
          path: voting
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/offline-jwt
          path: offline-jwt
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/transactional-outbox
          path: transactional-outbox
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/infrastructure-spring-outbox
          path: infrastructure-spring-outbox
      # consumers of what this service publishes — checkout only (their pacts/), no build.
      # BOTH are required: offboarding holds the saga-confirmation pact, user-collections holds the
      # COMMENTS_DELETED cascade pact. Until 2026-07-29 only the first was cloned, so
      # CommentsDeletedPactProviderTest was @EnabledIf-skipped on every CI run — under a step
      # called "including pact provider verification" — and SilentlySkippedPactTest could not
      # complain either, because its assumeTrue on the missing directory made IT skip too.
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-offboarding
          path: microservice-offboarding
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-user-collections
          path: microservice-user-collections
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install the shared libraries
        run: |
          mvn -B -q --no-transfer-progress -f voting/pom.xml install -DskipTests
          mvn -B -q --no-transfer-progress -f offline-jwt/pom.xml install -DskipTests
          mvn -B -q --no-transfer-progress -f transactional-outbox/pom.xml install -DskipTests
          mvn -B -q --no-transfer-progress -f infrastructure-spring-outbox/pom.xml install -DskipTests
      - name: Build and test (including pact provider verification)
        run: mvn -B --no-transfer-progress -f microservice-comments/pom.xml clean verify

      # Does the thing we just built actually START?
      #
      # `mvn verify` cannot answer that, and on 2026-07-29 it proved it twice in one afternoon over
      # in microservice-security. Tests run on the TEST classpath and construct beans by hand; the
      # service runs on its packaged jar and is assembled by a container. A dependency declared with
      # a narrower scope vanished from the runtime libs (NoClassDefFoundError on boot) and a bean
      # with two constructors and no @Inject made every health endpoint answer 500 — both through
      # entirely green builds. Neither is exotic; both are one careless line away here too.
      #
      # No infrastructure needed: H2 is at runtime scope precisely so the packaged jar can come up
      # without a database (see the pom's comment on it), and the broker address points at nothing.
      # What is under test is the ARTIFACT — that it assembles, wires and answers — not its
      # behaviour, which the suite above owns.
      #
      # KAFKA IS ON, with a dead bootstrap address. The first version of this step ran with
      # kafka-enabled=false, which meant the listeners, the outbox, the error handler and the
      # confirmation channel — every bean this service only has BECAUSE it takes part in the saga —
      # were never constructed, so a runtime dependency reaching the jar only down the Kafka path
      # could vanish and this gate would still pass. That is the same hole security's gate had and
      # closed the same afternoon: a gate that covers one member of a family is not a gate for the
      # family. ListenerHeartbeatTest already proves the full wiring comes up without a broker.
      #
      # 500 is the failure being watched for: it means the endpoint itself is broken. 200 and 503
      # are verdicts, and both are acceptable answers from a service whose broker is not there.
      - name: Prove the packaged service boots and answers its probes
        run: |
          cd microservice-comments
          SPRING_DATASOURCE_URL='jdbc:h2:mem:bootsmoke;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE' \
            SPRING_DATASOURCE_USERNAME=sa SPRING_DATASOURCE_PASSWORD= \
            COMMENTS_KAFKA_ENABLED=true SPRING_KAFKA_BOOTSTRAP_SERVERS=localhost:1 \
            SERVER_PORT=18085 MANAGEMENT_SERVER_PORT=19085 \
            java -jar target/microservice-comments-1.0.0-SNAPSHOT.jar > /tmp/boot-smoke.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:19085/actuator/health && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::the packaged service died during startup"
              tail -40 /tmp/boot-smoke.log
              exit 1
            fi
            sleep 2
          done
          fail() { echo "::error::$1"; tail -40 /tmp/boot-smoke.log; kill "$pid" 2>/dev/null; exit 1; }
          for path in /actuator/health /actuator/health/readiness /actuator/health/liveness; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:19085$path" || echo 000)
            case "$code" in
              200|503) echo "$path: $code" ;;
              *) fail "$path answered $code — the manifest probes it and would never pass" ;;
            esac
          done
          # the management PORT is part of the answer: the actuator lives on its own connector so
          # nothing routes it from the ingress, and a probe on the request port must find nothing
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18085/actuator/health || echo 000)
          [ "$code" = "404" ] || fail "the request port answered $code for /actuator/health; it must not serve the actuator at all"
          # and the listener lamp has to be IN the answer, or readiness is reporting on nothing
          curl -s http://localhost:19085/actuator/health | grep -q kafkaListeners \
            || fail "the health report does not name kafkaListeners — the lamp was not built"
          kill "$pid" 2>/dev/null || true

      # A skipped verification reads green, so the run says out loud that both executed.
      - name: Prove the pact verifications actually ran
        if: always()
        run: |
          reports=microservice-comments/target/surefire-reports
          for test in CommentsDeletedPactProviderTest PurgeConfirmationPactProviderTest; do
            file="$reports/TEST-com.jrobertgardzinski.comments.infrastructure.$test.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$test produced no surefire report — it never ran."
              ls -1 "$reports" || true
              exit 1
            fi
            cases=$(grep -c '<testcase' "$file" || true)
            skips=$(grep -c '<skipped' "$file" || true)
            if [ "$cases" -eq 0 ] || [ "$cases" -eq "$skips" ]; then
              echo "::error::$test executed no interaction ($cases case(s), $skips skipped)."
              echo "The consumer pact is not where @PactFolder looks — check the checkout paths."
              exit 1
            fi
            echo "$test: $cases interaction(s) verified, $skips skipped."
          done
